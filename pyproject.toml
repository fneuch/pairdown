[project]
name = "pairdown"
version = "0.0.1"
description = "PairDown feasibility spike: backend tests"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
